# Prometheus config mounted by observability-up.sh (the observability-local pod:
# Prometheus + Grafana in one shared network namespace).
#
# It scrapes the OTel Collector's Prometheus exporter (see otel-collector-config.yaml's
# `prometheus` exporter on :8889), which republishes the gen_ai.* metrics Fluxnova emits
# over OTLP. The target is the fluxnova-local pod resolved by *pod* name over the shared
# `fluxnova-dev` user-defined network (Podman's aardvark-dns resolves by pod name) — the
# observability-local pod joins that same network in observability-up.sh, so
# `fluxnova-local:8889` is reachable pod-to-pod (host.containers.internal does NOT work
# for pod-to-pod traffic on this machine — see fluxnova-up.sh / local-dev/README.md).
#
# The scrape interval matches default.yml's metricExportIntervalMillis: 5000 so we don't
# poll faster than Fluxnova exports new metric points.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['fluxnova-local:8889']
        labels:
          service: fluxnova-otel-collector
