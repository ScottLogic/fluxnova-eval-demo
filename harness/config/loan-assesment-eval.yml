# yaml-language-server: $schema=../src/fluxnova/workflow-config.schema.json
# Fluxnova workflow harness configuration
#
# Run with:  harness workflow.yml
#            harness --wait workflow.yml   (blocks until the instance completes)

# Engine REST base URL
fluxnova_url: http://localhost:8080/engine-rest

# Path from root to the BPMN file — relative to this config file or absolute
bpmn_path: bpmn/loan-assesment-eval.bpmn

# Process definition key (the `id` attribute on <process> in the BPMN)
# Distinct from loan-assesment.yml's `loanAssessmentProcess` — this BPMN has its
# own <process id="loanAssessmentEvalProcess"> so the two definitions deploy as
# separate process definitions in Fluxnova rather than two versions of one.
process_key: loanAssessmentEvalProcess
subprocess_id: AdHocSubProcess_LoanAssessmentAgent

# Path to the golden dataset used for evaluation (relative to the repo root).
# Generate or regenerate with: python datasets/loan-assessment/generate.py
dataset_path: datasets/loan-assessment/goldens.json

# Tools available to the agent inside the ad-hoc subprocess.
# Maps the BPMN service task element ID to its human-readable display name.
available_tools:
  ServiceTask_CreditScoreCheck: Check Credit Score
  ServiceTask_VerifyEmployment: Verify Employment
  ServiceTask_BankStatementAnalysis: Analyse Bank Statements
  ServiceTask_FraudScreening: Run Fraud Screening
  ServiceTask_CollateralValuation: Value Collateral
  ServiceTask_AffordabilityAssessment: Assess Affordability

# Tools the agent is expected to call, as a flat list of rules evaluated top-to-bottom.
# Each rule has a required "tool" key and an optional "if" expression.
# Without "if" the tool is always expected. The expression syntax mirrors GitLab CI:
#   $variable == "value"   $variable != "value"   $variable == true
expected_tools:
  - tool: Check Credit Score
  - tool: Run Fraud Screening
  - tool: Assess Affordability
  - if: '$applicantType == "EMPLOYED"'
    tool: Verify Employment
  - if: '$applicantType != "EMPLOYED"'
    tool: Analyse Bank Statements
  - if: '$hasCollateral == true'
    tool: Value Collateral

# Human-readable deployment name shown in Cockpit
deployment_name: Loan Assessment (Eval)

# Initial process variables (plain key: value pairs)
variables:
  applicationId: APP-001
  customerId: C001
  applicantName: Jane Smith
  requestedAmount: 50000
  applicantType: EMPLOYED
  hasCollateral: false
  collateralDescription: ""
  loanPurpose: Home improvement

# Mock external task workers: topic name -> output variables to complete the task with
mock_workers:
  credit-score-check:
    creditScore: 720
    creditRiskBand: LOW
  employment-verification:
    employmentVerified: true
    annualIncome: 55000
  bank-statement-analysis:
    bankStatementScore: 78
    annualIncome: 52000
  fraud-screening:
    fraudRiskScore: 12
  collateral-valuation:
    collateralValue: 180000
  affordability-assessment:
    debtToIncomeRatio: 0.28
    affordabilityPassed: true
  generate-assessment-report:
    recommendedDecision: APPROVE
  rejection-notification: {}
