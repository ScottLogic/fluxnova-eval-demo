# OTel Collector config for local development.
#
# Receives OTLP traces from the Fluxnova container (and, if you point your local
# agent instrumentation at this collector too, from the host) and forwards them
# straight to the MLflow tracking server's native OTLP endpoint, per the main
# README's architecture (OTel Collector -> MLflow /v1/traces -> trace store).
#
# MLFLOW_OTLP_ENDPOINT is an internal service URL in bridge mode, or the
# VM-local published MLflow port for the pod scripts' host-network fallback.
#
# MLflow's OTLP endpoint requires an `x-mlflow-experiment-id` header on every request
# (see https://mlflow.org/docs/latest/genai/tracing/opentelemetry/ingest/) — it's the
# *numeric* experiment ID (not the name). MLflow's startup script creates/resolves
# the experiment by name and writes its headers to a shared volume before we start.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # otlp_http automatically appends /v1/traces to this base endpoint.
  otlp_http:
    endpoint: ${env:MLFLOW_OTLP_ENDPOINT}
    tls:
      insecure: true
    headers: ${file:/mlflow-runtime/headers.yaml}

  # Exposes a Prometheus scrape endpoint on :8889 so the observability-local pod's
  # Prometheus (prometheus.yml) can pull the gen_ai.* metrics Fluxnova emits over OTLP,
  # which Grafana then dashboards. Prometheus reaches fluxnova-local:8889 in
  # bridge mode, or localhost:8889 with the host-network fallback.
  # `send_timestamps`/`resource_to_telemetry_conversion` keep OTLP resource attributes
  # (e.g. service.name) queryable as Prometheus labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http, debug]
    # Fans the gen_ai.* metrics out to the Prometheus exporter above (independent of the
    # traces pipeline, which still goes to MLflow). See local-dev/README.md's
    # observability section and the main README's "Metrics" table for the metric list.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
