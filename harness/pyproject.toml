[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxnova-harness"
version = "0.1.0"
description = "Evaluation harness (MLflow) for Fluxnova agentic workflows"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "fluxnova-mlflow-dataset",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mlflow[genai]>=3.15",
]

[project.scripts]
mlflow-eval = "mlflow_eval.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxnova = ["*.schema.json"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["fluxnova"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
