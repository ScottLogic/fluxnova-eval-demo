[pytest]
addopts = --tb=short -p mlflow.pytest.plugin
# Live logging so the long per-golden agent runs and scoring report progress to
# the console in real time instead of the session appearing to hang. Noisy
# third-party loggers are capped to WARNING in conftest.py so only the suite's
# own INFO progress lines show.
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %H:%M:%S

# Both come from dependencies, not this repo: camunda-external-task-client's
# Pydantic v1-style @validator usage, and mlflow.data.digest_utils calling
# DataFrame.all() ahead of pandas 4.0's keyword-only change.
filterwarnings =
    ignore:Pydantic V1 style `@validator` validators are deprecated:pydantic.warnings.PydanticDeprecatedSince20
    ignore:Starting with pandas version 4.0 all arguments of all will be keyword-only.:pandas.errors.Pandas4Warning
