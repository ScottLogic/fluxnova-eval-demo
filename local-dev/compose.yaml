# Portable bridge-networked alternative to the pod scripts.
# Use one orchestration method at a time. Windows host-network fallback: pod scripts.
# Start: podman compose --profile eval --profile grafana up -d --build
services:
  postgres-local:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16}
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      MLFLOW_POSTGRES_USER: ${MLFLOW_POSTGRES_USER:-mlflow}
      MLFLOW_POSTGRES_PASSWORD: ${MLFLOW_POSTGRES_PASSWORD:-mlflow}
      MLFLOW_POSTGRES_DB: ${MLFLOW_POSTGRES_DB:-mlflow}
      FLUXNOVA_POSTGRES_USER: ${FLUXNOVA_POSTGRES_USER:-fluxnova}
      FLUXNOVA_POSTGRES_PASSWORD: ${FLUXNOVA_POSTGRES_PASSWORD:-fluxnova}
      FLUXNOVA_POSTGRES_DB: ${FLUXNOVA_POSTGRES_DB:-fluxnova}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

  mlflow-local:
    image: ${MLFLOW_IMAGE:-ghcr.io/mlflow/mlflow:v3.16.0}
    container_name: mlflow
    depends_on:
      postgres-local:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${MLFLOW_POSTGRES_USER:-mlflow}:${MLFLOW_POSTGRES_PASSWORD:-mlflow}@postgres-local:5432/${MLFLOW_POSTGRES_DB:-mlflow}
      EVAL_SERVICE_EXPERIMENT_NAME: ${EVAL_SERVICE_EXPERIMENT_NAME:-fluxnova-loanAssessmentEvalProcess}
    entrypoint: [sh, /local-dev-mlflow/start.sh]
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - ./.mlflow/artifacts:/mlflow-artifacts
      - mlflow-local-runtime:/mlflow-runtime
      - ./mlflow:/local-dev-mlflow:ro
    healthcheck:
      test: [CMD-SHELL, "test -s /mlflow-runtime/headers.yaml && python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/version')\""]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

  otel-collector-local:
    image: ${OTEL_COLLECTOR_IMAGE:-docker.io/otel/opentelemetry-collector-contrib:0.160.0}
    container_name: otel-collector
    depends_on:
      mlflow-local:
        condition: service_healthy
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      MLFLOW_OTLP_ENDPOINT: ${MLFLOW_OTLP_ENDPOINT:-http://mlflow-local:5000}
    ports:
      - "${FLUXNOVA_PORT:-8080}:8080"
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8889}:8889"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - mlflow-local-runtime:/mlflow-runtime:ro
    networks:
      default:
        # Fluxnova shares this namespace, so this alias reaches its REST API too.
        aliases: [fluxnova-local]

  fluxnova-local:
    image: ${FLUXNOVA_IMAGE:-ghcr.io/dogle-scottlogic/fluxnova-edd-platform:1.2.0}
    platform: ${FLUXNOVA_PLATFORM:-linux/amd64}
    container_name: fluxnova
    network_mode: service:otel-collector-local
    depends_on:
      postgres-local:
        condition: service_healthy
      otel-collector-local:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      FLUXNOVA_POSTGRES_HOST: postgres-local
      FLUXNOVA_POSTGRES_PORT: 5432
      FLUXNOVA_POSTGRES_USER: ${FLUXNOVA_POSTGRES_USER:-fluxnova}
      FLUXNOVA_POSTGRES_PASSWORD: ${FLUXNOVA_POSTGRES_PASSWORD:-fluxnova}
      FLUXNOVA_POSTGRES_DB: ${FLUXNOVA_POSTGRES_DB:-fluxnova}
      SPRING_AI_OLLAMA_BASE_URL: ${OLLAMA_CONTAINER_URL:-http://host.containers.internal:11434}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./default.yml:/fluxnova/configuration/default.yml:ro
    # The published image does not define HEALTHCHECK. Gate dependent workers on
    # the actual REST endpoint, including slow first boots under x86 emulation.
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, "3", "http://localhost:8080/engine-rest/engine"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 45s

  eval-service-worker-local:
    profiles: [eval]
    build:
      context: ..
      dockerfile: eval-service-worker/Dockerfile
    image: ${EVAL_SERVICE_IMAGE:-eval-service-worker:local}
    container_name: eval-service-worker
    depends_on:
      mlflow-local:
        condition: service_healthy
      fluxnova-local:
        condition: service_healthy
    environment:
      EVAL_SERVICE_FLUXNOVA_URL: ${EVAL_SERVICE_FLUXNOVA_URL:-http://fluxnova-local:8080/engine-rest}
      EVAL_SERVICE_TRACKING_URI: ${EVAL_SERVICE_TRACKING_URI:-http://mlflow-local:5000}
      MLFLOW_DISABLE_TELEMETRY: "true"
      EVAL_SERVICE_EXPERIMENT_NAME: ${EVAL_SERVICE_EXPERIMENT_NAME:-fluxnova-loanAssessmentEvalProcess}
      EVAL_SERVICE_JUDGE_MODEL: ${EVAL_SERVICE_JUDGE_MODEL:-${DECISION_QUALITY_MODEL:-openai:/gpt-4.1-mini}}
      EVAL_SERVICE_LOCK_DURATION_MS: ${EVAL_SERVICE_LOCK_DURATION_MS:-600000}
      FLUXNOVA_USERNAME: ${FLUXNOVA_USERNAME:-demo}
      FLUXNOVA_PASSWORD: ${FLUXNOVA_PASSWORD:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_JUDGE_PROVIDER: ${LLM_JUDGE_PROVIDER:-openai}
      DECISION_QUALITY_MODEL: ${DECISION_QUALITY_MODEL:-}
      OLLAMA_API_BASE: ${OLLAMA_CONTAINER_URL:-http://host.containers.internal:11434}

  eval-trace-listener-local:
    profiles: [eval]
    build:
      context: ..
      dockerfile: eval-trace-listener/Dockerfile
    image: ${EVAL_LISTENER_IMAGE:-eval-trace-listener:local}
    container_name: eval-trace-listener
    depends_on:
      mlflow-local:
        condition: service_healthy
    environment:
      EVAL_LISTENER_TRACKING_URI: ${EVAL_LISTENER_TRACKING_URI:-http://mlflow-local:5000}
      MLFLOW_DISABLE_TELEMETRY: "true"
      EVAL_LISTENER_EXPERIMENT_NAME: ${EVAL_LISTENER_EXPERIMENT_NAME:-${EVAL_SERVICE_EXPERIMENT_NAME:-fluxnova-loanAssessmentEvalProcess}}
      EVAL_LISTENER_CONTROL_PORT: "8092"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_JUDGE_PROVIDER: ${LLM_JUDGE_PROVIDER:-openai}
      DECISION_QUALITY_MODEL: ${DECISION_QUALITY_MODEL:-}
      OLLAMA_API_BASE: ${OLLAMA_CONTAINER_URL:-http://host.containers.internal:11434}

    ports:
      - "${EVAL_LISTENER_CONTROL_PORT:-8092}:8092"
    networks:
      default:
        aliases: [eval-listener-local]

  frontend-local:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: ${FRONTEND_IMAGE:-frontend:local}
    container_name: frontend
    depends_on:
      fluxnova-local:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8081}:80"
      - "${UI_API_PORT:-8090}:8090"
    environment:
      API_PROXY_PASS: ${FRONTEND_API_PROXY_PASS:-http://localhost:8090}

  ui-api-local:
    build:
      context: ..
      dockerfile: ui-api/Dockerfile
    image: ${UI_API_IMAGE:-ui-api:local}
    container_name: ui-api
    network_mode: service:frontend-local
    depends_on:
      frontend-local:
        condition: service_started
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    environment:
      UI_API_PORT: "8090"
      MLFLOW_DISABLE_TELEMETRY: "true"
      FLUXNOVA_URL: ${UI_API_FLUXNOVA_URL:-http://fluxnova-local:8080/engine-rest}
      MLFLOW_TRACKING_URI: ${UI_API_TRACKING_URI:-http://mlflow-local:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-${EVAL_SERVICE_EXPERIMENT_NAME:-fluxnova-loanAssessmentEvalProcess}}
      EVAL_SERVICE_EXPERIMENT_NAME: ${EVAL_SERVICE_EXPERIMENT_NAME:-fluxnova-loanAssessmentEvalProcess}
      UI_API_EVAL_LISTENER_URL: ${UI_API_EVAL_LISTENER_URL:-http://eval-listener-local:8092}
      FLUXNOVA_USERNAME: ${FLUXNOVA_USERNAME:-demo}
      FLUXNOVA_PASSWORD: ${FLUXNOVA_PASSWORD:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_JUDGE_PROVIDER: ${LLM_JUDGE_PROVIDER:-openai}
      DECISION_QUALITY_MODEL: ${DECISION_QUALITY_MODEL:-}
      OLLAMA_API_BASE: ${OLLAMA_CONTAINER_URL:-http://host.containers.internal:11434}

  prometheus-local:
    profiles: [grafana]
    image: ${PROMETHEUS_IMAGE:-docker.io/prom/prometheus:v3.14.0}
    container_name: prometheus
    depends_on:
      otel-collector-local:
        condition: service_started
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      default:
        aliases: [observability-local]

  grafana-local:
    profiles: [grafana]
    image: ${GRAFANA_IMAGE:-docker.io/grafana/grafana:13.2.1}
    container_name: grafana
    network_mode: service:prometheus-local
    depends_on:
      prometheus-local:
        condition: service_started
    environment:
      PROMETHEUS_URL: http://localhost:9090
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres-local-data:
    name: ${POSTGRES_VOLUME:-postgres-local-data}
  mlflow-local-runtime:
    name: ${MLFLOW_RUNTIME_VOLUME:-mlflow-local-runtime}

networks:
  default:
    name: ${DEV_NETWORK:-fluxnova-dev}
