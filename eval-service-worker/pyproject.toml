[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-service-worker"
version = "0.1.0"
description = "Standalone BPMN external-task worker that resolves agent subprocess instances and scores their MLflow traces with shared judges and deterministic checks."
requires-python = ">=3.11"
dependencies = [
    "mlflow[genai]==3.16.0",
    "fluxnova-mlflow-dataset",
    "camunda-external-task-client-python3>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
eval-service-worker = "eval_service_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["eval_service_worker"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"
