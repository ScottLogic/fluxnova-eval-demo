# OTel Collector config for local development.
#
# Receives OTLP traces from the Fluxnova container (and, if you point your local
# agent instrumentation at this collector too, from the host) and forwards them
# straight to the MLflow tracking server's native OTLP endpoint, per the main
# README's architecture (OTel Collector -> MLflow /v1/traces -> trace store).
#
# This pod (fluxnova-local) runs on --network host (see OTEL-EXPORT-INVESTIGATION.md at
# the repo root — running Fluxnova in any isolated Podman network namespace silently
# breaks the OpenTelemetry Java SDK's OTLP export), so it isn't attached to the
# fluxnova-dev network and can't resolve mlflow-local by pod name. MLFLOW_OTLP_ENDPOINT is
# set per-scenario by fluxnova-up.sh — defaults to `http://localhost:5000`, reaching
# mlflow-local via its own published host port (mlflow-up.sh's ${MLFLOW_PORT:-5000}:5000),
# or override in .env for a different port/host-run MLflow.
#
# MLflow's OTLP endpoint requires an `x-mlflow-experiment-id` header on every request
# (see https://mlflow.org/docs/latest/genai/tracing/opentelemetry/ingest/) — it's the
# *numeric* experiment ID (not the name), and the experiment must already exist. Set
# MLFLOW_EXPERIMENT_ID in .env (fluxnova-up.sh passes it through as an env var here) — see
# local-dev/README.md for how to look this ID up.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # otlp_http automatically appends /v1/traces to this base endpoint.
  otlp_http:
    endpoint: ${env:MLFLOW_OTLP_ENDPOINT}
    tls:
      insecure: true
    headers:
      x-mlflow-experiment-id: ${env:MLFLOW_EXPERIMENT_ID}

  # Exposes a Prometheus scrape endpoint on :8889 so the observability-local pod's
  # Prometheus (prometheus.yml) can pull the gen_ai.* metrics Fluxnova emits over OTLP,
  # which Grafana then dashboards. This port is bound directly on the host (fluxnova-local
  # runs on --network host — see OTEL-EXPORT-INVESTIGATION.md), reachable from Prometheus's
  # own pod via host.containers.internal:8889 (see prometheus.yml).
  # `send_timestamps`/`resource_to_telemetry_conversion` keep OTLP resource attributes
  # (e.g. service.name) queryable as Prometheus labels.
  prometheus:
    endpoint: 0.0.0.0:8889
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_http, debug]
    # Fans the gen_ai.* metrics out to the Prometheus exporter above (independent of the
    # traces pipeline, which still goes to MLflow). See local-dev/README.md's
    # observability section and the main README's "Metrics" table for the metric list.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
